.account-name{display:block;font-size:16px;line-height:24px;font-weight:500}
.account-number{display:block;font-size:12px;line-height:18px;color:var(--color-content-tertiary)}
.account-count{display:block;font-size:14px;line-height:20px;margin-top:var(--space-4)}
.account-summary{display:block;font-size:12px;line-height:18px;color:var(--color-content-tertiary);margin-top:var(--space-4)}
.account-toggle>.icon,.type-toggle>.icon{transform:rotate(90deg);transition:transform .15s}
.account-toggle[aria-expanded=true]>.icon,.type-toggle[aria-expanded=true]>.icon{transform:rotate(-90deg)}
.account-body{border-top:1px solid var(--color-background-divider)}
.account-body>.type{margin-left:0;padding-left:var(--space-16);padding-right:var(--space-16)}
.account-body>.instruments{border-top:0}
.account-body>.type+.instruments{border-left:0;margin-left:0}
.account-body .instrument{padding-left:var(--space-16);padding-right:var(--space-16)}
.account-body .instrument .nav{flex-wrap:wrap}
.account-body .instrument .grow{flex-basis:100%}
.account-body .instrument .amount{margin-left:auto}
.account-card .selected-caption{display:block}
@media(prefers-reduced-motion:reduce){.account-toggle>.icon,.type-toggle>.icon{transition:none}}
</style></head><body><main class="phone" id="app"></main><aside class="desktop-tools"><h3>Multiautorizace</h3><p>Interaktivní návrh podle CORE design systému.</p><a href="#home">Začít na přehledu</a><a href="#overview">Přehled autorizací</a><a href="navrh.md" target="_blank">Výzkum a rozhodnutí</a><button class="secondary-btn" id="reset">Obnovit ukázková data</button><small>Testovací data. Autorizace je simulovaná.</small></aside>
<script>

['c1','a1','collections','Zahradnictví Lípa',3200,'CZK','5. 10. 2026','101'],['c2','a1','collections','Bistro U parku',2100,'CZK','5. 10. 2026','102'],['c3','a1','collections','Hotel Zahrada',5800,'CZK','6. 10. 2026','103'],['c4','a1','collections','Kavárna Ráno',1700,'CZK','6. 10. 2026','104'],
['q1','a2','payments','4835477/0100',30000,'CZK','2. 10. 2026','756589870144'],['q2','a2','payments','Účetní služby',4500,'CZK','5. 10. 2026','202610'],

].map(([id,account,type,name,amount,currency,date,vs,error])=>({id,account,type,name,amount,currency,date,vs,error,subject:account==='personal'?'person':'company',children:account==='batch'?3:0}));
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}state=Object.assign({subject:'company',selected:[],expanded:[],done:[],review:[],returnRoute:'overview',detailBack:'overview',reviewBack:'overview',result:[],filter:'all'},state||{});
const app=document.getElementById('app');const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const money=(n,c='CZK')=>new Intl.NumberFormat('cs-CZ',{style:'currency',currency:c}).format(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const subjectName=()=>state.subject==='company'?'Ostružiny s.r.o.':'Řehoř Koudelka';
const available=()=>seed.filter(x=>x.subject===state.subject&&!state.done.includes(x.id));const selectable=xs=>xs.filter(x=>!x.error);const chosen=()=>selectable(available()).filter(x=>state.selected.includes(x.id));

const header=(title,back='overview',close=false)=>`<header class="hdr"><button class="back" data-go="${back}">${close?'':icon('caret-left')}${close?'Zavřít':'Zpět'}</button><h1>${title}</h1></header>`;
function cb(xs,label,key){let valid=selectable(xs),n=valid.filter(x=>state.selected.includes(x.id)).length;return `<label class="check check-only"><input type="checkbox" data-select="${key}" data-ids="${valid.map(x=>x.id).join(',')}" aria-label="${esc(label)}" ${valid.length&&n===valid.length?'checked':''} ${!valid.length?'disabled':''} data-mixed="${n>0&&n<valid.length}"></label>`}
function sumBlock(xs){let totals={};xs.forEach(x=>{let category={payments:'Platby',batches:'Platby v dávkách',standing:'Pravidelné částky',mandates:'Limity inkas',collections:'K inkasu'}[x.type],k=category+'|'+x.currency;totals[k]=(totals[k]||0)+x.amount});return Object.entries(totals).map(([k,v])=>`<div class="total-row"><span>${k.split('|')[0]}</span><strong>${money(v,k.split('|')[1])}</strong></div>`).join('')||'<small>Žádné vybrané položky</small>'}
function bottom(){let xs=chosen(),payments=xs.filter(x=>['payments','batches'].includes(x.type)),sums={};payments.forEach(x=>sums[x.currency]=(sums[x.currency]||0)+x.amount);let total=Object.entries(sums).sort(([a],[b])=>a.localeCompare(b)).map(([c,n])=>money(n,c)).join(' + ');return `<footer class="bottom"><div aria-live="polite"><div class="summary-line"><strong>${xs.length===1?'1 vybraný záznam':xs.length>=2&&xs.length<=4?xs.length+' vybrané záznamy':xs.length+' vybraných záznamů'}</strong>${xs.length?'<button class="link" data-action="clear">Zrušit výběr</button>':''}</div><p class="muted">${total?'Platby: '+total:xs.length?'Vybrány pravidelné příkazy nebo inkasa':'Vyberte položky k autorizaci'}</p>${xs.some(x=>!['payments','batches'].includes(x.type))?'<p class="muted">Pravidelné částky a limity jsou v souhrnu zvlášť.</p>':''}</div><button class="primary" data-action="review" ${!xs.length?'disabled':''}>${xs.length?'K autorizaci ('+xs.length+')':'K autorizaci'}</button></footer>`}
function item(x){return `<div class="instrument">${cb([x],x.name+' — '+money(x.amount,x.currency),x.id)}<button class="nav" data-go="detail/${x.id}"><span class="grow"><span>${esc(x.name)}</span><span class="muted">${x.date}${x.vs?' · VS '+x.vs:''}</span>${x.error?`<span class="error">${x.error}</span>`:x.type==='batches'?`<span class="muted">3 platby · dávka jako celek</span>`:''}${x.type==='standing'?'<span class="muted">Nový příkaz · měsíčně</span>':x.type==='mandates'?'<span class="muted">Nové svolení k inkasu</span>':''}</span><span class="amount">${money(x.amount,x.currency)}</span></button></div>`}
function selectionCaption(xs){let valid=selectable(xs),n=valid.filter(x=>state.selected.includes(x.id)).length;return n?`<span class="selected-caption">Vybráno ${n}</span>`:''}
function typeRow(account,type,xs){let key=account+'-'+type,open=state.expanded.includes(key);return `<div class="type">${cb(xs,'Vybrat '+types[type]+' — '+accounts[account].name,key)}<button class="type-toggle" data-expand="${key}" aria-expanded="${open}" aria-controls="items-${key}"><span class="grow type-title">${types[type]}<small>${authorizationItems(xs.length)}${xs.some(x=>x.error)?' · '+xs.filter(x=>x.error).length+' nelze vybrat':''}</small>${selectionCaption(xs)}</span>${icon('caret-right')}</button></div><div class="instruments" id="items-${key}" ${open?'':'hidden'}>${xs.map(item).join('')}</div>`}
function groupSummary(xs){const names={payments:['platba','platby','plateb'],standing:['trvalý příkaz','trvalé příkazy','trvalých příkazů'],mandates:['inkaso','inkasa','inkas'],collections:['příkaz k inkasu','příkazy k inkasu','příkazů k inkasu']};return [...new Set(xs.map(x=>x.type))].map(t=>{let n=xs.filter(x=>x.type===t).length;return n+' '+names[t][n===1?0:n<=4?1:2]}).join(' · ')}
function accountRow(a,xs){let key='account-'+a,open=state.expanded.includes(key),batch=a==='batch',name=batch?'Dávkové platby':accounts[a].name,ts=[...new Set(xs.map(x=>x.type))];return `<section class="card account-card" aria-label="${name}"><div class="group-head">${cb(xs,'Vybrat vše — '+name,a)}<h2 class="account-heading"><button class="account-toggle" data-expand="${key}" aria-expanded="${open}" aria-controls="items-${key}"><span class="grow"><span class="account-name">${name}</span>${batch?'':`<span class="account-number">${accounts[a].number}</span>`}<span class="account-count">${batch?xs.length+' '+(xs.length===1?'dávka':xs.length<=4?'dávky':'dávek')+' · '+xs.reduce((n,x)=>n+x.children,0)+' plateb':(ts.length===1?groupSummary(xs):authorizationItems(xs.length))+' k autorizaci'}</span>${!batch&&ts.length>1?`<span class="account-summary">${groupSummary(xs)}</span>`:''}${selectionCaption(xs)}</span>${icon('caret-right')}</button></h2></div><div class="account-body" id="items-${key}" ${open?'':'hidden'}>${batch||ts.length===1?`<div class="instruments">${xs.map(item).join('')}</div>`:ts.map(t=>typeRow(a,t,xs.filter(x=>x.type===t))).join('')}</div></section>`}
function overview(){let xs=available(),valid=selectable(xs),all=valid.length>0&&chosen().length===valid.length;return header('Přehled autorizací','subjects')+`<div class="content"><div class="secondary subject-context"><button class="subject-switch" data-go="subjects" aria-label="Změnit subjekt: ${subjectName()}">${icon(state.subject==='company'?'bank':'person')}<span class="grow"><span class="subject-name">${subjectName()}</span><small>${state.subject==='company'?'IČO: 123456789':'Osobní finance'}</small></span>${icon('caret-right')}</button>${valid.length?`<button class="subject-select" data-action="${all?'clear':'select-all'}" aria-label="${all?'Zrušit výběr všech položek':'Vybrat všechny položky, které lze autorizovat'}">${all?'Zrušit výběr':'Vybrat vše'}</button>`:''}</div>${xs.length?`<p class="overview-count">${authorizationItems(xs.length)} k autorizaci</p>${['batch',...Object.keys(accounts)].map(a=>{let group=xs.filter(x=>x.account===a);return group.length?accountRow(a,group):''}).join('')}`:'<div class="card empty"><h2>Vše je vyřízené</h2><p class="muted">Na tomto subjektu nemáte žádné další záznamy k autorizaci.</p></div>'}</div>`+bottom()}
function subjects(){return header('Vyberte subjekt','home',true)+`<div class="content"><p>U těchto máte požadavek k autorizaci.</p><div class="card">${[['person','Řehoř Koudelka',''],['company','Ostružiny s.r.o.','IČO: 123456789']].map(([s,n,desc])=>`<button class="row nav" data-subject="${s}"><span class="avatar">${icon(s==='company'?'bank':'person')}</span><span class="grow"><h3>${n}</h3>${desc?`<small>${desc}</small>`:''}<p class="subject-count">${authorizationItems(seed.filter(x=>x.subject===s&&!state.done.includes(x.id)).length)} k autorizaci</p></span>${icon('caret-right')}</button>`).join('')}</div></div>`}
function home(){return `<header class="hdr"><div class="row" style="justify-content:flex-end;padding:12px 0">${icon('key')}${icon('bank')}<span class="avatar">ŘK</span></div><div class="tabs home-tabs">${['Přehled','Extra','Karty','Spoření','Investice'].map((t,i)=>`<span class="tab" aria-pressed="${!i}">${t}</span>`).join('')}</div></header><div class="content">${[['Běžný účet','122000/0100',48490.2],['Běžný účet Business','125000/0100',1848490.2],['Běžný účet Business 2','137000/0100',486000.8]].map(([n,num,b],i)=>`${i?`<div class="row">${icon('bank')}<h3>Ostružiny s.r.o.</h3></div>`:''}<div class="secondary" style="padding:0;overflow:hidden"><div class="row">Tarif Komfort${i?' Business':''}<span class="grow"></span>${icon('caret-right')}</div><div class="card" style="padding:16px;box-shadow:none;border-radius:0"><div class="summary-line"><span>${n}</span><small>${num}</small></div><p class="balance">${money(b)}</p></div></div>`).join('')}</div><footer class="bottom" style="background:transparent;box-shadow:none"><div class="toolbar"><button disabled>${icon('send-payment')}Nová platba</button><button disabled>${icon('listed-items')}QR platba</button><button disabled>${icon('pay-me')}Zaplať mi</button><button data-go="subjects">${icon('key')}Autorizace</button></div></footer>`}
function detail(id){let x=seed.find(x=>x.id===id&&x.subject===state.subject);if(!x)return header('Záznam nenalezen')+'<div class="content"><p>Vraťte se do přehledu autorizací.</p></div>';let done=state.done.includes(id);return header(x.type==='payments'?'Platba k autorizaci':types[x.type],(state.detailBack||'overview'))+`<div class="content"><div class="card detail-hero"><span class="avatar">${icon(x.type==='batches'?'text-file':'person')}</span><h2>${esc(x.name)}</h2><p class="amount">${money(x.amount,x.currency)}</p><p class="muted">${x.type==='mandates'?'Limit inkasa':x.type==='standing'?'Pravidelná částka · měsíčně':x.date}</p></div><p class="message ${x.error?'alert':done?'success':''}">${done?'Autorizováno v prototypu':x.error?x.error+'. Tento záznam nelze autorizovat.':'Čeká se na autorizaci.'}</p><div class="card">${[['Subjekt',subjectName()],['Z účtu',accounts[x.account]?accounts[x.account].name+' · '+accounts[x.account].number:'Více účtů v rámci subjektu'],['Typ požadavku',x.type==='standing'?'Založení trvalého příkazu':x.type==='mandates'?'Založení svolení k inkasu':types[x.type]],['Datum',x.date],...(x.vs?[['Variabilní symbol',x.vs]]:[]),...(x.type==='batches'?[['Obsah dávky','3 platby · autorizuje se celá dávka']]:[]),['Zadal','Řehoř Koudelka · 2. 10. 2026'],['Autorizace','V tomto scénáři stačí jeden podpis']].map(([l,v])=>`<div class="label-value"><small>${l}</small><p>${esc(v)}</p></div>`).join('')}</div>${x.type==='batches'?`<div class="card"><div class="row"><h3>Platby v dávce</h3></div>${['První platba','Druhá platba','Třetí platba'].map((n,i)=>`<div class="row"><span class="grow">${n}<small style="display:block">${i?'137000/0100':'125000/0100'}</small></span><span>${money(x.amount/3)}</span></div>`).join('')}</div>`:''}</div><footer class="bottom">${!done?`<div style="display:flex;align-items:center;gap:8px">${cb([x],'Označit k autorizaci',id)}<span>Označit k autorizaci</span></div><button class="primary" data-single="${id}" ${x.error?'disabled':''}>Autorizovat tento záznam</button>`:'<button class="primary" data-go="overview">Zpět na přehled</button>'}</footer>`}
function limits(xs){let messages=[];for(let [a,acct] of Object.entries(accounts)){let total=xs.filter(x=>x.account===a&&x.type==='payments'&&x.currency==='CZK').reduce((s,x)=>s+x.amount,0);let remaining=acct.limit-(state.spent?.[a]||0);if(total>remaining)messages.push(`${acct.name}: vybráno ${money(total)}, zbývající limit ${money(remaining)}.`)}return messages}
function review(){let xs=byIds(state.review).filter(x=>!x.error&&!state.done.includes(x.id)&&x.subject===state.subject),filtered=state.filter==='all'?xs:xs.filter(x=>x.type===state.filter),issues=limits(xs);return header('Zkontrolujte výběr',state.reviewBack||'overview')+`<div class="content"><div class="secondary"><h3>${subjectName()}</h3><small>${xs.length===1?'1 autorizační záznam':xs.length>=2&&xs.length<=4?xs.length+' autorizační záznamy':xs.length+' autorizačních záznamů'}${xs.some(x=>x.children)?' · včetně '+xs.filter(x=>x.children).reduce((s,x)=>s+x.children,0)+' plateb v dávkách':''}</small><div class="totals" style="margin-top:16px">${sumBlock(xs)}</div></div><p class="message">${xs.some(x=>['standing','mandates','collections'].includes(x.type))?'Částky trvalých příkazů, limity inkas a příkazy k inkasu nejsou součástí částky plateb.':'Autorizujete pouze záznamy uvedené níže.'}</p>${issues.map(m=>`<p class="message alert">${m}</p>`).join('')}<div class="tabs" aria-label="Filtrovat vybrané záznamy"><button class="tab" aria-pressed="${state.filter==='all'}" data-filter="all">Vše (${xs.length})</button>${[...new Set(xs.map(x=>x.type))].map(t=>`<button class="tab" aria-pressed="${state.filter===t}" data-filter="${t}">${types[t]} (${xs.filter(x=>x.type===t).length})</button>`).join('')}</div><div class="card">${filtered.length?filtered.map(x=>`<div class="review-item"><button class="nav" data-go="detail/${x.id}"><div class="summary-line"><h3>${esc(x.name)}</h3><span>${icon('caret-right')}</span></div><small>${accounts[x.account]?.number||'Dávka · 3 platby'} · ${types[x.type]}</small><p class="amount">${money(x.amount,x.currency)}</p></button><button class="link" data-remove="${x.id}">Odebrat z výběru</button></div>`).join(''):'<div class="empty">Žádné záznamy v tomto filtru.</div>'}</div><small>Limity a podpisové podmínky jsou v prototypu ukázkové.</small></div><footer class="bottom"><p class="muted">${records(xs.length)} · ${subjectName()}</p><button class="primary" data-go="pin" ${!xs.length||issues.length?'disabled':''}>Potvrdit autorizaci (${xs.length})</button></footer>`}
let pinValue='';function pin(){return header('Potvrzení autorizace','review',true)+`<div class="content"><div class="secondary"><h3>${subjectName()}</h3><p>${records(state.review.length)} k autorizaci</p></div><p>Zadejte ukázkový PIN pro potvrzení.</p><p class="muted">Jde o simulaci. Použijte libovolných 6 číslic, ne svůj skutečný PIN.</p><p class="pin-preview" aria-live="polite" aria-label="Zadáno ${pinValue.length} číslic">${'•'.repeat(pinValue.length)}${'○'.repeat(6-pinValue.length)}</p><div class="pin">${['1','2','3','4','5','6','7','8','9','Smazat','0',''].map(v=>v?`<button data-digit="${v}" ${v==='Smazat'?'style="font-size:14px"':''}>${v}</button>`:'<span></span>').join('')}</div></div>`}
function result(){let xs=byIds(state.result);return header('Autorizace dokončena','overview',true)+`<div class="content"><p class="message success">Autorizovali jste ${records(xs.length)}.</p><div class="secondary"><h3>${subjectName()}</h3><div class="totals" style="margin-top:16px">${sumBlock(xs)}</div></div><p>Tyto položky už nenajdete mezi čekajícími autorizacemi.</p><p class="muted">Výsledek je simulovaný. Neproběhla žádná skutečná bankovní operace.</p></div><footer class="bottom"><button class="primary" data-go="overview">Zpět na přehled autorizací</button></footer>`}
function render(){let route=location.hash.slice(1)||'home';if(route==='pin'&&!state.review.length)route='overview';let body=route==='home'?home():route==='subjects'?subjects():route==='overview'?overview():route==='review'?review():route==='pin'?pin():route==='result'?result():route.startsWith('detail/')?detail(route.split('/')[1]):overview();app.innerHTML='<div class="screen">'+body+'</div>';app.querySelectorAll('[data-mixed=true]').forEach(el=>el.indeterminate=true);document.title=(route==='overview'?'Přehled autorizací':route==='review'?'Zkontrolujte výběr':'Multiautorizace')+' · Multiautorizace'}
app.addEventListener('change',e=>{let el=e.target;if(el.matches('[data-select]')){let ids=el.dataset.ids.split(',').filter(Boolean);state.selected=el.checked?[...new Set([...state.selected,...ids])]:state.selected.filter(id=>!ids.includes(id));if(location.hash.startsWith('#detail/')&&state.detailBack==='review'){state.review=state.review.filter(id=>!ids.includes(id));if(el.checked)state.review=[...new Set([...state.review,...ids])]}save();render();app.querySelector('[data-select="'+el.dataset.select+'"]')?.focus({preventScroll:true})}});
app.addEventListener('click',e=>{let el=e.target.closest('button');if(!el||el.disabled)return;let r=location.hash.slice(1)||'home';if(el.dataset.go){if(el.dataset.go.startsWith('detail/')){state.detailBack=r;save()}if(el.dataset.go==='pin')pinValue='';go(el.dataset.go)}if(el.dataset.subject){state.subject=el.dataset.subject;state.selected=[];state.review=[];state.expanded=[];save();go('overview')}if(el.dataset.expand){let key=el.dataset.expand;state.expanded=state.expanded.includes(key)?state.expanded.filter(x=>x!==key):[...state.expanded,key];save();render();app.querySelector('[data-expand="'+key+'"]')?.focus({preventScroll:true})}if(el.dataset.action==='select-all'){state.selected=selectable(available()).map(x=>x.id);save();render();app.querySelector('.subject-select')?.focus({preventScroll:true})}if(el.dataset.action==='clear'){state.selected=[];save();render();app.querySelector('.subject-select')?.focus({preventScroll:true})}if(el.dataset.action==='review'||el.dataset.single){state.review=el.dataset.single?[el.dataset.single]:chosen().map(x=>x.id);if(el.dataset.single)state.selected=[...new Set([...state.selected,el.dataset.single])];state.reviewBack=r;state.filter='all';save();go('review')}if(el.dataset.filter){state.filter=el.dataset.filter;save();render()}if(el.dataset.remove){state.selected=state.selected.filter(id=>id!==el.dataset.remove);state.review=state.review.filter(id=>id!==el.dataset.remove);save();render()}if(el.dataset.digit){pinValue=el.dataset.digit==='Smazat'?pinValue.slice(0,-1):(pinValue+el.dataset.digit).slice(0,6);if(pinValue.length===6){let xs=byIds(state.review).filter(x=>!x.error&&!state.done.includes(x.id)&&x.subject===state.subject);if(limits(xs).length){go('review');return}state.result=xs.map(x=>x.id);state.done=[...new Set([...state.done,...state.result])];for(const [a,acct] of Object.entries(accounts)){let spent=xs.filter(x=>x.account===a&&x.type==='payments'&&x.currency==='CZK').reduce((s,x)=>s+x.amount,0);state.spent=state.spent||{};state.spent[a]=(state.spent[a]||0)+spent;}state.selected=state.selected.filter(x=>!state.result.includes(x));state.review=[];save();pinValue='';go('result')}else render()}});
document.getElementById('reset').onclick=()=>{state={subject:'company',selected:[],expanded:[],done:[],review:[],returnRoute:'overview',detailBack:'overview',reviewBack:'overview',result:[],filter:'all'};save();go('home');render()};window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);let h=app.querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}});render();
</script></body></html>
